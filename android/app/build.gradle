plugins {
    id 'com.android.application'
}

// Which game: the C++ that scripts/port.sh wrote into generated/<name>. The APK holds that translated code, so it is a build
// of a game you own for your own phone, the same as build/native-<name>/ps2run on the PC: do not share it.
//   gradlew assembleRelease -Pps2Game=thps4 -Pps2Title="THPS4" [-Pps2Abis=arm64-v8a,x86_64]
def game = project.findProperty('ps2Game') ?: 'thps4'
def title = project.findProperty('ps2Title') ?: game.toUpperCase()
def abis = (project.findProperty('ps2Abis') ?: 'arm64-v8a').tokenize(',')   // x86_64: the Android emulator on a PC
def generated = file("../../generated/${game}")
if (!generated.isDirectory()) {
    throw new GradleException("no translated game in ${generated}: run  bash scripts/port.sh ${game} <disc image> --native-only  first")
}
// the PS2_ switches the game always needs (games/<name>/env.txt, which ps2run reads on the PC): GameActivity sets them
def envFile = file("../../games/${game}/env.txt")
def gameEnv = envFile.isFile() ? envFile.readLines().collect { it.trim() }.findAll { it.startsWith('PS2_') && it.contains('=') }.join('\n') : ''

// The app's icon: games/<name>/icon.png (e.g. the cover; games/ is never committed), else Android's plain one. The picture is
// made square (its edge rows or columns stretched over the rest, not the picture itself) and becomes an adaptive icon: a
// launcher shows the middle 72 of its 108 dp and cuts that to its own shape, so the square fills those 72 dp, on itself
// enlarged to the full 108 dp (seen when the launcher moves the icon).
def iconFile = file("../../games/${game}/icon.png")
def iconRes = file("${buildDir}/generated/ps2icon/res")
def hasIcon = iconFile.isFile()
if (hasIcon) {
    def picture = javax.imageio.ImageIO.read(iconFile)
    if (picture == null) throw new GradleException("${iconFile} is not a picture ImageIO reads (PNG)")
    int w = picture.width, h = picture.height, side = Math.max(w, h), x0 = (side - w).intdiv(2), y0 = (side - h).intdiv(2)
    def square = new java.awt.image.BufferedImage(side, side, java.awt.image.BufferedImage.TYPE_INT_ARGB)
    def g = square.createGraphics()
    g.drawImage(picture, x0, y0, null)
    if (y0 > 0) {   // wider than high: the top row up, the bottom row down
        g.drawImage(picture, x0, 0, x0 + w, y0, 0, 0, w, 1, null)
        g.drawImage(picture, x0, y0 + h, x0 + w, side, 0, h - 1, w, h, null)
    }
    if (x0 > 0) {
        g.drawImage(picture, 0, y0, x0, y0 + h, 0, 0, 1, h, null)
        g.drawImage(picture, x0 + w, y0, side, y0 + h, w - 1, 0, w, h, null)
    }
    g.dispose()
    def scaled = { int size ->   // in halving steps, which keeps more of a large picture than one step down
        def image = square
        while (image.width > size) {
            int next = Math.max(size, image.width.intdiv(2))
            def smaller = new java.awt.image.BufferedImage(next, next, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def sg = smaller.createGraphics()
            sg.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
            sg.drawImage(image, 0, 0, next, next, null)
            sg.dispose()
            image = smaller
        }
        image
    }
    def drawables = new File(iconRes, 'drawable-nodpi')
    drawables.mkdirs()
    javax.imageio.ImageIO.write(scaled(288), 'png', new File(drawables, 'game_icon.png'))   // 72 dp at 4x
    def mipmaps = new File(iconRes, 'mipmap-anydpi-v26')
    mipmaps.mkdirs()
    new File(mipmaps, 'ic_launcher.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/game_icon" />
    <foreground>
        <inset android:drawable="@drawable/game_icon" android:inset="16.667%" />
    </foreground>
</adaptive-icon>
'''
} else {
    iconRes.deleteDir()
}

android {
    namespace 'ps2native.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "ps2native.${game.toLowerCase().replaceAll('[^a-z0-9_]', '_')}"
        minSdk 28                   // Android 9: Vulkan 1.1 phones, and posix_spawn for the runtime (live_build.cpp)
        targetSdk 35
        versionCode 1
        versionName '0.1'
        resValue 'string', 'app_name', title
        manifestPlaceholders = [appIcon: hasIcon ? '@mipmap/ic_launcher' : '@android:drawable/sym_def_app_icon']
        buildConfigField 'String', 'GAME', "\"${game}\""
        buildConfigField 'String', 'GAME_ENV', "\"${gameEnv.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')}\""
        ndk {
            abiFilters(*abis)
        }
        externalNativeBuild {
            cmake {
                // the game is always built optimised, also in a debug APK: at -O0 it would be far too slow to play
                arguments "-DPS2_GENERATED=${generated.absolutePath.replace('\\', '/')}", '-DCMAKE_BUILD_TYPE=Release',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'     // 16 KB pages (Android 15 devices)
                // ARM always has FMA: without this the compiler fuses multiply and add, which changes the vector units'
                // results (scripts/cxx.sh, "AVX2 is a build flag")
                cppFlags '-ffp-contract=off'
                targets 'main', 'SDL2'
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main.res.srcDirs += iconRes
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key unless -Pps2Keystore=... -Pps2KeyAlias=... -Pps2KeyPassword=... is given: fine for
            // installing it on your own phone
            signingConfig project.hasProperty('ps2Keystore') ? signingConfigs.create('ps2') {
                storeFile file(project.ps2Keystore); storePassword project.ps2KeyPassword
                keyAlias project.ps2KeyAlias; keyPassword project.ps2KeyPassword
            } : signingConfigs.debug
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true   // the libraries unpacked on install: libmain.so is large and starts faster from a file
        }
    }
    lint {
        abortOnError false
    }
}
